version: 2
updates:
  # Pinned Action SHAs; monthly is enough and avoids PR storms after CI changes.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - github_actions
    groups:
      # init/analyze must move together; mixed majors fail with
      # "Loaded a configuration file for version 'X', but running version 'Y'".
      codeql-action:
        patterns:
          - "github/codeql-action/*"

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - go

  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - javascript
