version: 2
updates:
  # Pinned Action SHAs; monthly is enough and avoids PR storms after CI changes.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - github_actions
    groups:
      # One PR per ecosystem. CodeQL init/analyze must move together;
      # mixed majors fail with "Loaded a configuration file for version 'X',
      # but running version 'Y'".
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - go
    groups:
      go-modules:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - javascript
    # Vitest 5+ is blocked by @cloudflare/vitest-plugin peer (vitest@^4.1.0).
    ignore:
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
    groups:
      # Patches/minors together. Majors stay solo so TS 7 is not bundled with Vitest 5.
      worker-dev:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
