version: 2
updates:
  # Pinned Action SHAs; monthly is enough and avoids PR storms after CI changes.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - go

  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - npm
