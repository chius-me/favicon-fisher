name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      stable: ${{ steps.tag.outputs.stable }}
    steps:
      - id: tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    uses: ./.github/workflows/verify.yml

  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            archive: tar.gz
          - goos: windows
            goarch: amd64
            archive: zip
          - goos: windows
            goarch: arm64
            archive: zip

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and package
        id: package
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          ARTIFACT_BASENAME="fvf_${TAG}_${GOOS}_${GOARCH}"
          BINARY_NAME="fvf"
          WEB_BINARY_NAME="fvf-web"
          if [ "$GOOS" = "windows" ]; then
            BINARY_NAME="${BINARY_NAME}.exe"
            WEB_BINARY_NAME="${WEB_BINARY_NAME}.exe"
          fi

          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/${BINARY_NAME}" ./cmd/fvf
          go build -trimpath -ldflags="-s -w" -o "dist/${WEB_BINARY_NAME}" ./cmd/fvf-web

          PACKAGE_ROOT="${RUNNER_TEMP}/${ARTIFACT_BASENAME}"
          rm -rf "${PACKAGE_ROOT}"
          mkdir -p "${PACKAGE_ROOT}"
          cp "dist/${BINARY_NAME}" "${PACKAGE_ROOT}/"
          cp "dist/${WEB_BINARY_NAME}" "${PACKAGE_ROOT}/"
          cp README.md LICENSE "${PACKAGE_ROOT}/"

          if [ "$ARCHIVE" = "zip" ]; then
            (cd "${RUNNER_TEMP}" && zip -rq "${GITHUB_WORKSPACE}/dist/${ARTIFACT_BASENAME}.zip" "${ARTIFACT_BASENAME}")
            echo "asset=dist/${ARTIFACT_BASENAME}.zip" >> "$GITHUB_OUTPUT"
          else
            tar -C "${RUNNER_TEMP}" -czf "dist/${ARTIFACT_BASENAME}.tar.gz" "${ARTIFACT_BASENAME}"
            echo "asset=dist/${ARTIFACT_BASENAME}.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload packaged artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ steps.package.outputs.asset }}
          if-no-files-found: error

  build-macos:
    # Free ad-hoc builds are the default. Developer ID notarization is opt-in.
    if: needs.metadata.outputs.stable == 'true'
    needs: [verify, metadata]
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Import Developer ID and notarization credentials
        if: vars.MACOS_NOTARIZE == 'true'
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          for name in CERTIFICATE_BASE64 CERTIFICATE_PASSWORD APPLE_ID APPLE_APP_PASSWORD APPLE_TEAM_ID SIGNING_IDENTITY; do
            test -n "${!name}" || { echo "Missing release credential: $name" >&2; exit 1; }
          done
          [[ "$SIGNING_IDENTITY" == "Developer ID Application:"* ]] || { echo "Developer ID Application signing identity required" >&2; exit 1; }
          KEYCHAIN="$RUNNER_TEMP/fvf-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/fvf-signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/fvf-signing.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          xcrun notarytool store-credentials fvf-notary --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --keychain "$KEYCHAIN"
      - name: Package app (optional notarization)
        env:
          MACOS_NOTARIZE: ${{ vars.MACOS_NOTARIZE == 'true' && 'true' || 'false' }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_PROFILE: fvf-notary
        run: MACOS_NOTARY_KEYCHAIN="$RUNNER_TEMP/fvf-signing.keychain-db" bash scripts/package-macos.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-app
          path: |
            dist/Favicon-Fisher-*-universal.dmg
            dist/favicon-fisher.rb
          if-no-files-found: error
      - name: Remove signing keychain
        if: always() && vars.MACOS_NOTARIZE == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/fvf-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/fvf-signing.p12"
      - name: Preserve notarization diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-notarization-diagnostics
          path: dist/notary-*.json
          if-no-files-found: ignore
          retention-days: 7

  release:
    needs: [build, build-macos]
    if: always() && needs.build.result == 'success' && (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/*

  update-homebrew:
    needs: [release, build-macos]
    if: always() && vars.HOMEBREW_TAP_AUTOMATION == 'true' && needs.release.result == 'success' && needs.build-macos.result == 'success'
    uses: ./.github/workflows/update-homebrew.yml
    permissions:
      contents: read
    with:
      tag: ${{ github.ref_name }}
      notarized: ${{ vars.MACOS_NOTARIZE == 'true' }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
