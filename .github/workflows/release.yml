name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            archive: tar.gz
          - goos: windows
            goarch: amd64
            archive: zip
          - goos: windows
            goarch: arm64
            archive: zip

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and package
        id: package
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          ARTIFACT_BASENAME="fvf_${TAG}_${GOOS}_${GOARCH}"
          BINARY_NAME="fvf"
          WEB_BINARY_NAME="fvf-web"
          if [ "$GOOS" = "windows" ]; then
            BINARY_NAME="${BINARY_NAME}.exe"
            WEB_BINARY_NAME="${WEB_BINARY_NAME}.exe"
          fi

          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/${BINARY_NAME}" ./cmd/fvf
          go build -trimpath -ldflags="-s -w" -o "dist/${WEB_BINARY_NAME}" ./cmd/fvf-web

          PACKAGE_ROOT="${RUNNER_TEMP}/${ARTIFACT_BASENAME}"
          rm -rf "${PACKAGE_ROOT}"
          mkdir -p "${PACKAGE_ROOT}"
          cp "dist/${BINARY_NAME}" "${PACKAGE_ROOT}/"
          cp "dist/${WEB_BINARY_NAME}" "${PACKAGE_ROOT}/"
          cp README.md LICENSE "${PACKAGE_ROOT}/"

          if [ "$ARCHIVE" = "zip" ]; then
            (cd "${RUNNER_TEMP}" && zip -rq "${GITHUB_WORKSPACE}/dist/${ARTIFACT_BASENAME}.zip" "${ARTIFACT_BASENAME}")
            echo "asset=dist/${ARTIFACT_BASENAME}.zip" >> "$GITHUB_OUTPUT"
          else
            tar -C "${RUNNER_TEMP}" -czf "dist/${ARTIFACT_BASENAME}.tar.gz" "${ARTIFACT_BASENAME}"
            echo "asset=dist/${ARTIFACT_BASENAME}.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload packaged artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ steps.package.outputs.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/*
