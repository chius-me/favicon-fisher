# Reusable verification gate — required by CI, Release, Container, Deploy.
name: verify

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-go:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Run test suite
        run: go test ./...

      - name: Race detector
        run: go test -race ./...

      - name: Fuzz smoke (short)
        run: |
          set -euo pipefail
          # The fuzzer can FAIL with "context deadline exceeded" when workers
          # do not drain in the last milliseconds of -fuzztime. Skip minimize
          # and retry once so a shutdown race does not fail the gate.
          fuzz() {
            local pkg="$1" target="$2"
            local args=("$pkg" -run='^$' -fuzz="$target" -fuzztime=5s -fuzzminimizetime=0 -timeout=1m)
            go test "${args[@]}" || go test "${args[@]}"
          }
          fuzz ./internal/fetcher FuzzNormalizeInputURL
          fuzz ./internal/security FuzzSignerRoundTrip
          fuzz ./internal/convert FuzzSniffFormat

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Sync check Go web static JS
        run: |
          npm install --no-save typescript@5.9.3
          npx tsc -p internal/web/static/tsconfig.json
          git diff --exit-code -- internal/web/static/app.js

  check-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test:golden
      - run: npm test

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: OSV Scanner (Go + npm lockfiles)
        run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@latest
          osv-scanner --lockfile=go.mod --lockfile=worker/package-lock.json
        continue-on-error: true

      - name: npm audit (production deps)
        working-directory: worker
        run: npm ci && npm audit --omit=dev --audit-level=high
        continue-on-error: true
