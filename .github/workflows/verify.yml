# Reusable verification gate — required by CI, Release, Container, Deploy.
name: verify

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build desktop helper and test Swift integration
        run: |
          go build -o "$RUNNER_TEMP/fvf-engine" ./cmd/fvf-engine
          FVF_TEST_ENGINE="$RUNNER_TEMP/fvf-engine" swift test --package-path macos
      - name: Validate release scripts and offline safety checks
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          python3 scripts/tests/test_macos_release.py
      - name: Build Universal app and verify signature
        run: bash scripts/build-macos.sh 0.1.0

  test-go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Run test suite
        run: go test ./...

      - name: Race detector
        run: go test -race ./...

      - name: Fuzz smoke (short)
        run: |
          set -euo pipefail
          fuzz() {
            local pkg="$1" target="$2"
            local args=("$pkg" -run='^$' -fuzz="$target" -fuzztime=5s -fuzzminimizetime=0 -timeout=1m)
            go test "${args[@]}" || go test "${args[@]}"
          }
          fuzz ./internal/fetcher FuzzNormalizeInputURL
          fuzz ./internal/security FuzzSignerRoundTrip
          fuzz ./internal/convert FuzzSniffFormat

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Sync check Go web static JS
        run: |
          npm install --no-save typescript@5.9.3
          npx tsc -p internal/web/static/tsconfig.json
          git diff --exit-code -- internal/web/static/app.js

  check-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test:golden
      - run: npm test

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: OSV Scanner (Go + npm lockfiles)
        run: |
          GOTOOLCHAIN=auto go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.0
          osv-scanner scan source --lockfile=go.mod --lockfile=worker/package-lock.json
        continue-on-error: true

      - name: npm audit (production deps)
        working-directory: worker
        run: npm ci && npm audit --omit=dev --audit-level=high
        continue-on-error: true
