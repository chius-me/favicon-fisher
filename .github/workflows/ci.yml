name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-go:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Run test suite
        run: go test ./...

      - name: Race detector
        run: go test -race ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Sync check Go web static JS
        run: |
          npm install --no-save typescript@5.9.3
          npx tsc -p internal/web/static/tsconfig.json
          git diff --exit-code -- internal/web/static/app.js

  check-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test:golden
